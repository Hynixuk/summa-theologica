<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8a2f2f">
<meta name="description" content="Read and listen to Aristotle's Metaphysics, Summa Contra Gentiles, and Summa Theologica with synchronized audio and cross-references.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%238a2f2f' width='192' height='192'/><text x='96' y='96' dominant-baseline='middle' text-anchor='middle' font-size='140' font-weight='bold' fill='%23fff' font-family='serif'>T</text></svg>">
<title>Summa Theologica — Read &amp; Listen</title>
<script>
// Apply the saved theme before first paint so there's no flash of the wrong palette
// (e.g. explicit "light" selected while the OS prefers dark, or vice versa).
(function () {
  try {
    var t = localStorage.getItem('summa-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="scrim" class="scrim"></div>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Open table of contents" title="Table of contents">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="topbar-title">
    <span id="topbarWork" class="topbar-work">SUMMA THEOLOGICA</span>
    <span id="topbarLocation" class="topbar-location"></span>
  </div>
  <button id="searchBtn" class="icon-btn" aria-label="Search the Summa" title="Search">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark">
    <svg id="sunIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none">
      <circle cx="12" cy="12" r="5" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M22.5 12h-3M4.5 12h-3M19.07 4.93l-2.12 2.12M7.05 16.95l-2.12 2.12M19.07 19.07l-2.12-2.12M7.05 7.05 4.93 4.93"/></g>
    </svg>
    <svg id="moonIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none">
      <path d="M20.6 15.2A9 9 0 1 1 8.8 3.4a7 7 0 0 0 11.8 11.8z" fill="currentColor"/>
    </svg>
    <svg id="autoIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
    </svg>
  </button>
</header>

<div id="searchOverlay" class="search-overlay">
  <div id="searchPanel" class="search-panel" role="dialog" aria-modal="true" aria-label="Search the Summa">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="search-bar-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search questions, articles, and text…" autocomplete="off" aria-label="Search">
      <button id="closeSearchBtn" class="icon-btn" aria-label="Close search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<nav id="drawer" class="drawer" aria-label="Table of contents">
  <div class="drawer-head">
    <button id="backToMenuBtn" class="icon-btn" aria-label="Back to menu" title="Back to menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 id="drawerHeadTitle">Contents</h2>
    <button id="closeDrawerBtn" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="drawerTree" class="drawer-tree" data-active-work="ST"></div>
</nav>

<div id="menuScreen" class="menu-screen" aria-label="Choose a work" aria-modal="true" role="dialog">
  <div class="menu-screen-panel">
    <div class="menu-screen-head">
      <h2>Menu</h2>
      <button id="closeMenuBtn" class="icon-btn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="workSwitch" class="menu-page-list" role="list" aria-label="Choose work">
      <button type="button" class="menu-page-item" data-work="META" role="listitem">
        <span class="menu-page-num">1</span>
        <span class="menu-page-text">
          <span class="menu-page-title">Aristotle&rsquo;s Metaphysics</span>
          <span class="menu-page-desc">The philosophical groundwork for the Summa</span>
        </span>
      </button>
      <button type="button" class="menu-page-item" data-work="SCG" role="listitem">
        <span class="menu-page-num">2</span>
        <span class="menu-page-text">
          <span class="menu-page-title">Summa Contra Gentiles</span>
          <span class="menu-page-desc">Reasoned apologetics for the faith</span>
        </span>
      </button>
      <button type="button" class="menu-page-item" data-work="ST" role="listitem">
        <span class="menu-page-num">3</span>
        <span class="menu-page-text">
          <span class="menu-page-title">Summa Theologica</span>
          <span class="menu-page-desc">The complete systematic theology</span>
        </span>
      </button>
      <button type="button" class="menu-page-item" data-work="TOPICS" role="listitem">
        <span class="menu-page-num menu-page-num--blank" aria-hidden="true"></span>
        <span class="menu-page-text">
          <span class="menu-page-title">Topics</span>
          <span class="menu-page-desc">Cross-reference key questions across all three works</span>
        </span>
      </button>
    </div>
    <div class="curriculum-note">Suggested order: Metaphysics for the philosophical groundwork, then the Summa Contra Gentiles, then the Summa Theologica — but every work is open to read in any order.</div>
  </div>
</div>

<main id="content" class="content">
  <div id="questionView" class="question-view"></div>
  <div id="chapterView" class="question-view" style="display:none"></div>
  <nav class="pager">
    <button id="prevBtn" class="pager-btn">← Previous Question</button>
    <button id="nextBtn" class="pager-btn">Next Question →</button>
  </nav>
</main>

<footer id="player" class="player">
  <div class="player-info">
    <div id="playerTrackTitle" class="player-track-title">No audio loaded</div>
    <div class="player-time">
      <span id="curTime">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      <span id="durTime">0:00</span>
    </div>
  </div>
  <div class="player-controls">
    <button id="prevTrackBtn" class="icon-btn" title="Previous track">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6v12M18 6l-9 6 9 6V6z" fill="currentColor"/></svg>
    </button>
    <button id="playBtn" class="icon-btn play-btn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l12-7z" fill="currentColor"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" width="26" height="26" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
    </button>
    <button id="nextTrackBtn" class="icon-btn" title="Next track">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 6v12M6 6l9 6-9 6V6z" fill="currentColor"/></svg>
    </button>
    <button id="skip10bBtn" class="icon-btn" title="Rewind 10 seconds">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v5.25L15.25 13l1.06-1.06-4.81-4.94z" fill="currentColor"/></svg>
    </button>
    <button id="skip10fBtn" class="icon-btn" title="Forward 10 seconds">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-.5-13v5.25L7.25 11l-1.06 1.06 4.81 4.94.5-.5V7z" fill="currentColor"/></svg>
    </button>
    <button id="speedBtn" class="icon-btn speed-btn" aria-label="Playback speed: 1x" title="Playback speed: 1x (click to change)">1x</button>
  </div>
  <audio id="audioEl" preload="metadata"></audio>
</footer>

<script src="data.js"></script>
<script src="data-scg.js" onerror="window.SCG_BOOKS = window.SCG_BOOKS || []; window.SCG_TEXT = window.SCG_TEXT || {};"></script>
<script>window.SCG_BOOKS = window.SCG_BOOKS || []; window.SCG_TEXT = window.SCG_TEXT || {};</script>
<script src="data-metaphysics.js" onerror="window.METAPHYSICS_BOOKS = window.METAPHYSICS_BOOKS || []; window.METAPHYSICS_TEXT = window.METAPHYSICS_TEXT || {};"></script>
<script>window.METAPHYSICS_BOOKS = window.METAPHYSICS_BOOKS || []; window.METAPHYSICS_TEXT = window.METAPHYSICS_TEXT || {};</script>
<script src="alignment-data.js" onerror="window.SUMMA_ALIGNMENT = window.SUMMA_ALIGNMENT || {};"></script>
<script>window.SUMMA_ALIGNMENT = window.SUMMA_ALIGNMENT || {};</script>
<script src="data-topics.js" onerror="window.TOPICS = window.TOPICS || {categories:[]};"></script>
<script>window.TOPICS = window.TOPICS || {categories:[]};</script>
<script src="data-aquinas-commentary.js" onerror="window.AQUINAS_COMMENTARY = window.AQUINAS_COMMENTARY || {};"></script>
<script>window.AQUINAS_COMMENTARY = window.AQUINAS_COMMENTARY || {};</script>
<script src="app.js"></script>
<script>
// Register service worker for offline support and PWA functionality
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', { scope: './' })
    .then(function(reg) {
      console.log('[PWA] Service Worker registered:', reg);
    })
    .catch(function(err) {
      console.log('[PWA] Service Worker registration failed:', err);
    });
}
</script>
</body>
</html>
